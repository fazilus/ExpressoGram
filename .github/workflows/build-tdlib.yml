name: Build TDLib JNI

on:
  workflow_dispatch:
    inputs:
      tdlib_commit:
        description: 'TDLib commit/branch (empty = latest)'
        required: false
        default: ''

env:
  TDLIB_REPO: https://github.com/tdlib/td.git

concurrency:
  group: build-tdlib-jni
  cancel-in-progress: true

jobs:
  # ============================================
  # Get latest TDLib commit
  # ============================================
  get-tdlib-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.get-commit.outputs.sha }}
      commit_short: ${{ steps.get-commit.outputs.short }}
    
    steps:
      - name: Get TDLib commit
        id: get-commit
        env:
          INPUT_COMMIT: ${{ inputs.tdlib_commit }}
          TDLIB_REPO_URL: ${{ env.TDLIB_REPO }}
        run: |
          if [ -n "$INPUT_COMMIT" ]; then
            COMMIT_SHA=$(git ls-remote "$TDLIB_REPO_URL" "$INPUT_COMMIT" | head -1 | cut -f1)
            if [ -z "$COMMIT_SHA" ]; then
              COMMIT_SHA="$INPUT_COMMIT"
              echo "::notice::'$INPUT_COMMIT' not found as branch/tag, using as direct commit SHA."
            fi
          else
            COMMIT_SHA=$(git ls-remote "$TDLIB_REPO_URL" HEAD | cut -f1)
          fi
          
          COMMIT_SHORT=${COMMIT_SHA:0:7}
          
          # Validate: should be a hex string of at least 7 characters
          if [ ${#COMMIT_SHA} -lt 7 ] || ! echo "$COMMIT_SHA" | grep -qE '^[0-9a-f]+$'; then
            echo "::error::Invalid commit SHA: '$COMMIT_SHA'. Expected a hex string of at least 7 characters."
            exit 1
          fi
          
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "Using TDLib commit: $COMMIT_SHA ($COMMIT_SHORT)"

  # ============================================
  # Windows x64 Build (Static)
  # ============================================
  build-windows:
    needs: get-tdlib-version
    runs-on: windows-2022
    timeout-minutes: 100
    
    steps:
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set JAVA_HOME with forward slashes
        shell: bash
        run: |
          JAVA_HOME_FIXED=$(echo "$JAVA_HOME" | sed 's|\\|/|g')
          echo "JAVA_HOME_CMAKE=$JAVA_HOME_FIXED" >> $GITHUB_ENV

      - name: Install gperf
        run: choco install gperf -y

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-x64-windows-static-v1

      - name: Install vcpkg and dependencies (static)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd ${{ github.workspace }}

          if (-not (Test-Path "vcpkg\.git")) {
            if (Test-Path "vcpkg") {
              Write-Host "Removing incomplete/stale vcpkg directory (likely left over from cache restore)..."
              Remove-Item -Recurse -Force "vcpkg"
            }
            git clone https://github.com/Microsoft/vcpkg.git
          } else {
            Write-Host "vcpkg repo already present, skipping clone."
          }

          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install openssl:x64-windows-static zlib:x64-windows-static

      - name: Clone TDLib
        shell: bash
        run: |
          git clone ${{ env.TDLIB_REPO }} td
          cd td
          git checkout ${{ needs.get-tdlib-version.outputs.commit_sha }}

      - name: Patch CMakeLists.txt to skip javadoc
        shell: bash
        run: |
          cd td/example/java
          
          python3 << 'EOF'
          import re
          
          with open('CMakeLists.txt', 'r') as f:
              content = f.read()
          
          original_content = content
          
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api\s+build_java\s+generate_javadoc\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api\s+generate_javadoc\s+build_java\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api[^)]*build_java[^)]*\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          
          if original_content == content:
              print("::warning::CMakeLists.txt patch pattern not matched! TDLib build might fail or build unnecessary Java targets.")
          else:
              print("CMakeLists.txt patched successfully.")
          
          with open('CMakeLists.txt', 'w') as f:
              f.write(content)
          EOF

      - name: Configure TDLib with JNI
        shell: bash
        run: |
          cd td
          mkdir -p jnibuild
          cd jnibuild
          
          cmake -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DTD_ENABLE_JNI=ON \
            -DJAVA_HOME="$JAVA_HOME_CMAKE" \
            -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td \
            ..

      - name: Build TDLib
        shell: pwsh
        run: |
          cd td/jnibuild
          cmake --build . --config Release --parallel 4
          
      - name: Install TDLib
        shell: pwsh
        run: |
          cd td/jnibuild
          cmake --install . --config Release

      - name: Configure JNI Wrapper
        shell: bash
        run: |
          cd td/example/java
          mkdir -p build
          cd build
          
          cmake -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTd_DIR="${{ github.workspace }}/td/example/java/td/lib/cmake/Td" \
            -DJAVA_HOME="$JAVA_HOME_CMAKE" \
            ..

      - name: Build JNI Wrapper
        shell: pwsh
        run: |
          cd td/example/java/build
          cmake --build . --config Release --target tdjni

      - name: Find and prepare artifacts
        shell: pwsh
        run: |
          mkdir -p artifacts/windows-x64
          
          $dllFiles = Get-ChildItem -Path td -Recurse -Filter "tdjni.dll" -ErrorAction SilentlyContinue
          
          if ($dllFiles) {
            Copy-Item $dllFiles[0].FullName -Destination artifacts/windows-x64/
            
            Write-Host "=== DLL Dependencies ==="
            $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
            if ($dumpbin) {
              dumpbin /dependents $dllFiles[0].FullName
            } else {
              Write-Host "::warning::dumpbin not found, skipping dependency check."
            }
          } else {
            Write-Host "tdjni.dll not found!"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-windows-x64-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/windows-x64/tdjni.dll
          if-no-files-found: error

  # ============================================
  # Linux (Ubuntu 22.04) Build (Dynamic)
  # ============================================
  build-linux:
    needs: get-tdlib-version
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    
    steps:
      - name: Checkout own repository (converter)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/convert_tdapi.py
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gperf \
            libssl-dev \
            zlib1g-dev \
            php-cli

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone TDLib
        run: |
          git clone ${{ env.TDLIB_REPO }} td
          cd td
          git checkout ${{ needs.get-tdlib-version.outputs.commit_sha }}

      - name: Patch CMakeLists.txt to skip javadoc
        run: |
          cd td/example/java
          
          python3 << 'EOF'
          import re
          
          with open('CMakeLists.txt', 'r') as f:
              content = f.read()
          
          original_content = content
          
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api\s+build_java\s+generate_javadoc\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api\s+generate_javadoc\s+build_java\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          content = re.sub(
              r'add_dependencies\(tdjni\s+td_generate_java_api[^)]*build_java[^)]*\)',
              'add_dependencies(tdjni td_generate_java_api)',
              content
          )
          
          if original_content == content:
              print("::warning::CMakeLists.txt patch pattern not matched! TDLib build might fail or build unnecessary Java targets.")
          else:
              print("CMakeLists.txt patched successfully.")
          
          with open('CMakeLists.txt', 'w') as f:
              f.write(content)
          EOF

      - name: Configure TDLib with JNI
        run: |
          cd td
          mkdir -p jnibuild
          cd jnibuild
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=ON \
            -DCMAKE_INSTALL_PREFIX:PATH=../example/java/td \
            ..

      - name: Build and Install TDLib
        run: |
          cd td/jnibuild
          cmake --build . --target install --parallel $(nproc)

      - name: Configure JNI Wrapper
        run: |
          cd td/example/java
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DTd_DIR=${{ github.workspace }}/td/example/java/td/lib/cmake/Td \
            ..

      - name: Build JNI Wrapper
        run: |
          cd td/example/java/build
          cmake --build . --target tdjni --parallel $(nproc)

      - name: Convert TdApi.java to TdApi.kt
        run: |
          JAVA_FILE=$(find td -name "TdApi.java" -type f 2>/dev/null | head -1)
          if [ -z "$JAVA_FILE" ]; then
            echo "::error::TdApi.java not found after build — td_generate_java_api may have failed silently."
            exit 1
          fi
          mkdir -p artifacts/kotlin
          cp "$JAVA_FILE" artifacts/kotlin/TdApi.java
          cp tools/convert_tdapi.py artifacts/kotlin/convert_tdapi.py
          
          # Copy Client.java for Javadoc generation
          CLIENT_FILE="td/example/java/org/drinkless/tdlib/Client.java"
          if [ -f "$CLIENT_FILE" ]; then
            cp "$CLIENT_FILE" artifacts/kotlin/Client.java
          else
            echo "::warning::Client.java not found at expected path. Javadoc generation might fail."
          fi
          
          cd artifacts/kotlin
          CONVERTER_STRICT=1 python3 convert_tdapi.py

      - name: Verify TdApi.kt compiles
        run: |
          KOTLIN_VERSION="2.0.21"
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlinc.zip
          unzip -q kotlinc.zip
          
          chmod +x ./kotlinc/bin/kotlinc
          
          echo "=== Kotlin compiler version ==="
          ./kotlinc/bin/kotlinc -version
          
          ./kotlinc/bin/kotlinc -J-Xmx4g artifacts/kotlin/TdApi.kt -d /tmp/tdapi-check.jar
          echo "TdApi.kt compiles cleanly."

      - name: Upload TdApi.kt artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-tdapi-kotlin-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: |
            artifacts/kotlin/TdApi.kt
            artifacts/kotlin/TdApi.conversion-stats.json
            artifacts/kotlin/TdApi.java
            artifacts/kotlin/Client.java
          if-no-files-found: error

      - name: Find and prepare artifacts
        run: |
          mkdir -p artifacts/linux-x64
          
          SO_FILE=$(find td -name "libtdjni.so" -type f 2>/dev/null | head -1)
          
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" artifacts/linux-x64/
            
            echo "=== Library Dependencies ==="
            ldd "$SO_FILE"
            
            echo "=== File size ==="
            ls -lh "$SO_FILE"
          else
            echo "libtdjni.so not found!"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-linux-x64-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/linux-x64/libtdjni.so
          if-no-files-found: error

  # ============================================
  # Android Build (using official scripts)
  # ============================================
  build-android:
    needs: get-tdlib-version
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gperf \
            ninja-build \
            php-cli \
            libssl-dev \
            zlib1g-dev \
            perl

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          # Install required components per TDLib docs: android-34 platform and CMake 3.22.1
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "cmake;3.22.1"
          
          echo "ANDROID_NDK_VERSION=26.1.10909125" >> $GITHUB_ENV

      - name: Clone TDLib
        run: |
          git clone ${{ env.TDLIB_REPO }} td
          cd td
          git checkout ${{ needs.get-tdlib-version.outputs.commit_sha }}

      - name: Check environment
        run: |
          cd td/example/android
          chmod +x check-environment.sh
          ./check-environment.sh || true
          
          echo ""
          echo "=== Android SDK location ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT/ndk/ || true

      - name: Cache OpenSSL for Android
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/openssl-android
          key: openssl-android-${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Build OpenSSL for Android
        run: |
          cd td/example/android
          chmod +x build-openssl.sh
          
          if [ -d "${{ github.workspace }}/openssl-android" ] && [ "$(ls -A ${{ github.workspace }}/openssl-android 2>/dev/null)" ]; then
            echo "=== OpenSSL cache hit, skipping build ==="
          else
            # Parameters: SDK_PATH NDK_VERSION [OPENSSL_INSTALL_DIR] [OPENSSL_VERSION]
            ./build-openssl.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" "${{ github.workspace }}/openssl-android"
          fi

      - name: Build TDLib for Android
        run: |
          cd td/example/android
          chmod +x build-tdlib.sh
          
          # Parameters: SDK_PATH NDK_VERSION [OPENSSL_PATH] [ANDROID_STL] [INTERFACE_TYPE]
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" "${{ github.workspace }}/openssl-android"

      - name: Find and prepare artifacts
        run: |
          mkdir -p artifacts/android/armeabi-v7a
          mkdir -p artifacts/android/arm64-v8a
          mkdir -p artifacts/android/x86
          mkdir -p artifacts/android/x86_64
          
          echo "=== Searching for output files ==="
          find td/example/android/tdlib -type f -name "*.so" -ls 2>/dev/null || true
          
          TDLIB_LIBS="td/example/android/tdlib/libs"
          
          if [ -d "$TDLIB_LIBS" ]; then
            echo "=== Found libs directory ==="
            find "$TDLIB_LIBS" -type f -ls
            
            [ -f "$TDLIB_LIBS/armeabi-v7a/libtdjni.so" ] && cp "$TDLIB_LIBS/armeabi-v7a/libtdjni.so" artifacts/android/armeabi-v7a/
            [ -f "$TDLIB_LIBS/arm64-v8a/libtdjni.so" ] && cp "$TDLIB_LIBS/arm64-v8a/libtdjni.so" artifacts/android/arm64-v8a/
            [ -f "$TDLIB_LIBS/x86/libtdjni.so" ] && cp "$TDLIB_LIBS/x86/libtdjni.so" artifacts/android/x86/
            [ -f "$TDLIB_LIBS/x86_64/libtdjni.so" ] && cp "$TDLIB_LIBS/x86_64/libtdjni.so" artifacts/android/x86_64/
          else
            echo "tdlib/libs not found, searching elsewhere..."
            find td -name "libtdjni.so" -type f -ls
          fi
          
          echo "=== Final artifacts ==="
          find artifacts -type f -ls

      - name: Upload Android armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-android-armeabi-v7a-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/android/armeabi-v7a/libtdjni.so
          if-no-files-found: error

      - name: Upload Android arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-android-arm64-v8a-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/android/arm64-v8a/libtdjni.so
          if-no-files-found: error

      - name: Upload Android x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-android-x86-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/android/x86/libtdjni.so
          if-no-files-found: error

      - name: Upload Android x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jni-android-x86_64-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/android/x86_64/libtdjni.so
          if-no-files-found: error

  # ============================================
  # Build Javadoc Documentation
  # ============================================
  build-javadoc:
    needs: [get-tdlib-version, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Java sources
        uses: actions/download-artifact@v4
        with:
          name: tdlib-tdapi-kotlin-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: java-sources

      - name: Generate Javadoc
        run: |
          mkdir -p artifacts/javadoc
          mkdir -p artifacts/java-sources/org/drinkless/tdlib
          
          cp java-sources/TdApi.java artifacts/java-sources/org/drinkless/tdlib/
          
          # Client.java may be missing from artifact if it wasn't found during build
          JAVADOC_SOURCES="artifacts/java-sources/org/drinkless/tdlib/TdApi.java"
          if [ -f "java-sources/Client.java" ]; then
            cp java-sources/Client.java artifacts/java-sources/org/drinkless/tdlib/
            JAVADOC_SOURCES="$JAVADOC_SOURCES artifacts/java-sources/org/drinkless/tdlib/Client.java"
          else
            echo "::warning::Client.java not found in artifacts. Javadoc will only cover TdApi."
          fi
          
          javadoc \
            -d artifacts/javadoc \
            -sourcepath artifacts/java-sources \
            -windowtitle "TDLib Java API" \
            -doctitle "TDLib Java API Documentation" \
            -header "TDLib JNI" \
            -Xdoclint:none \
            -quiet \
            $JAVADOC_SOURCES

          if [ ! -f "artifacts/javadoc/index.html" ]; then
            echo "::error::Javadoc generation did not produce index.html. See the javadoc output above for the actual error."
            exit 1
          fi

          cat > artifacts/VERSION.txt << EOF
          TDLib Javadoc
          TDLib commit: ${{ needs.get-tdlib-version.outputs.commit_sha }}
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Upload Javadoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-javadoc-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: artifacts/

  # ============================================
  # Combine all artifacts
  # ============================================
  combine-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [get-tdlib-version, build-windows, build-linux, build-android, build-javadoc]
    if: |
      always() && 
      (needs.build-windows.result == 'success' || 
       needs.build-linux.result == 'success' || 
       needs.build-android.result == 'success' ||
       needs.build-javadoc.result == 'success')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize artifacts
        run: |
          COMMIT_SHORT=${{ needs.get-tdlib-version.outputs.commit_short }}
          COMMIT_FULL=${{ needs.get-tdlib-version.outputs.commit_sha }}
          
          mkdir -p release/windows-x64
          mkdir -p release/linux-x64
          mkdir -p release/android/armeabi-v7a
          mkdir -p release/android/arm64-v8a
          mkdir -p release/android/x86
          mkdir -p release/android/x86_64
          mkdir -p release/kotlin
          mkdir -p release/javadoc
          mkdir -p release/java-sources
          
          # Copy binaries
          [ -d "all-artifacts/tdlib-jni-windows-x64-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-windows-x64-$COMMIT_SHORT/* release/windows-x64/ || true
          [ -d "all-artifacts/tdlib-jni-linux-x64-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-linux-x64-$COMMIT_SHORT/* release/linux-x64/ || true
          [ -d "all-artifacts/tdlib-jni-android-armeabi-v7a-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-android-armeabi-v7a-$COMMIT_SHORT/* release/android/armeabi-v7a/ || true
          [ -d "all-artifacts/tdlib-jni-android-arm64-v8a-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-android-arm64-v8a-$COMMIT_SHORT/* release/android/arm64-v8a/ || true
          [ -d "all-artifacts/tdlib-jni-android-x86-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-android-x86-$COMMIT_SHORT/* release/android/x86/ || true
          [ -d "all-artifacts/tdlib-jni-android-x86_64-$COMMIT_SHORT" ] && cp all-artifacts/tdlib-jni-android-x86_64-$COMMIT_SHORT/* release/android/x86_64/ || true

          # Copy generated Kotlin API
          TDAPI_CONVERSION_SUMMARY="TdApi.kt was not generated (build-linux did not run or failed)."
          if [ -d "all-artifacts/tdlib-tdapi-kotlin-$COMMIT_SHORT" ]; then
            cp all-artifacts/tdlib-tdapi-kotlin-$COMMIT_SHORT/TdApi.kt release/kotlin/ || true
            # Stats are folded into VERSION.txt below, not copied as a separate file
            # to avoid duplicating the same information twice in the release.
            if [ -f "all-artifacts/tdlib-tdapi-kotlin-$COMMIT_SHORT/TdApi.conversion-stats.json" ]; then
              TDAPI_CONVERSION_SUMMARY=$(cat all-artifacts/tdlib-tdapi-kotlin-$COMMIT_SHORT/TdApi.conversion-stats.json)
            fi
          fi
          
          # Copy javadoc
          if [ -d "all-artifacts/tdlib-javadoc-$COMMIT_SHORT" ]; then
            [ -d "all-artifacts/tdlib-javadoc-$COMMIT_SHORT/javadoc" ] && cp -r all-artifacts/tdlib-javadoc-$COMMIT_SHORT/javadoc/* release/javadoc/ || true
            [ -d "all-artifacts/tdlib-javadoc-$COMMIT_SHORT/java-sources" ] && cp -r all-artifacts/tdlib-javadoc-$COMMIT_SHORT/java-sources/* release/java-sources/ || true
          fi
          
          # Remove empty directories
          find release -type d -empty -delete 2>/dev/null || true
          
          # Create VERSION.txt
          cat > release/VERSION.txt << EOL
          TDLib JNI Build Information
          ===========================
          TDLib commit: $COMMIT_FULL
          TDLib commit (short): $COMMIT_SHORT
          Build date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          Platforms:
          - Windows x64 (static linking)
          - Linux x64 (dynamic linking, requires libssl, libcrypto, zlib)
          - Android armeabi-v7a (API 21+, static linking)
          - Android arm64-v8a (API 21+, static linking)
          - Android x86 (API 21+, static linking)
          - Android x86_64 (API 21+, static linking)
          
          TdApi.kt conversion stats:
          $TDAPI_CONVERSION_SUMMARY
          EOL
          
          echo "=== Build artifacts ==="
          find release -type f -ls

      - name: Upload combined release
        uses: actions/upload-artifact@v4
        with:
          name: expressogram-tdlib-${{ needs.get-tdlib-version.outputs.commit_short }}
          path: release/
          if-no-files-found: error
